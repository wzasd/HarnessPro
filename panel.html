<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: var(--foreground, #ddd); background: var(--background, transparent); }
      h1 { margin: 0 0 8px; font-size: 16px; }
      h2 { margin: 16px 0 6px; font-size: 13px; }
      p, li { line-height: 1.6; }
      ul { margin: 6px 0; padding-left: 20px; }
      kbd { display: inline-block; padding: 1px 5px; border: 1px solid var(--border, #555); border-radius: 4px; background: var(--secondary, #2a2a2a); font: 12px ui-monospace, monospace; }
      .note { color: var(--muted-foreground, #999); }
    </style>
  </head>
  <body>
    <h1>HarnessPro</h1>
    <p>后台任务由 worker 执行，不需要打开终端。</p>

    <h2>多 Agent 进化</h2>
    <ul>
      <li><kbd>Ctrl + Shift + H</kbd> 开始进化</li>
      <li><kbd>Ctrl + Shift + J</kbd> 查看状态</li>
      <li><kbd>Ctrl + Shift + K</kbd> 停止进化</li>
    </ul>
    <p>采用 Medium 候选：按 <kbd>Ctrl + Shift + A</kbd>。</p>

    <h2>插件自检</h2>
    <ul>
      <li><kbd>Ctrl + Shift + L</kbd> 运行自检</li>
    </ul>
    <p class="note">任务状态通过 Orca 通知显示。日志保存在 ~/.local/state/harnesspro/。</p>
  </body>
</html>
